name: Build OnePlus 9 Pro Android 17 BPF kernel

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Kernel feature profile
        required: true
        default: plain
        type: choice
        options:
          - plain
          - containers
      kernel_ref:
        description: Branch, tag, or commit in tqmane/android_kernel_oppo_sm8350-private
        required: true
        default: oneplus/sm8350v_17.0.0_oneplus9pro_sukisu
        type: string
  pull_request:
    paths:
      - .github/workflows/blank.yml
      - .github/workflows/yun-kernel.yml
      - config.env
      - scripts/**
      - patch/**

jobs:
  build-selected-profile:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/yun-kernel.yml
    with:
      profile: ${{ inputs.profile }}
      kernel_ref: ${{ inputs.kernel_ref }}
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.GH_PAT }}

  validate-pull-request:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        profile:
          - plain
          - containers
    uses: ./.github/workflows/yun-kernel.yml
    with:
      profile: ${{ matrix.profile }}
      # Test both Action profiles against the related kernel hardening PR.
      # This is changed back to the production ref before merge.
      kernel_ref: fix/android17-bpf-task-storage-recursion
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.GH_PAT }}
