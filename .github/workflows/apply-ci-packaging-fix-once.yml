name: Apply CI packaging safety fix once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-ci-packaging-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/a17-bpf-ci-current-branch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/a17-bpf-ci-current-branch
          fetch-depth: 0

      - name: Make container packaging module-safe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/yun-kernel.yml')
          text = path.read_text()

          old = '              require_disabled CONFIG_USER_NS\n'
          new = '              require_y CONFIG_USER_NS\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected USER_NS validation layout')
          text = text.replace(old, new, 1)

          start_marker = '      - name: Collect kernel and AnyKernel3 artifacts\n'
          end_marker = '      - name: Upload failure diagnostics\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''      - name: Collect profile artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p artifacts/dist

          image_path="$(find out -type f -path "*/dist/${KERNEL_IMAGE_NAME}" \
            -print -quit 2>/dev/null || true)"
          if [[ -z "$image_path" || ! -f "$image_path" ]]; then
            echo "::error::Built kernel image '$KERNEL_IMAGE_NAME' was not found in dist"
            exit 1
          fi
          dist_dir="$(dirname "$image_path")"

          cp -a "$dist_dir/." artifacts/dist/
          cp "$GITHUB_WORKSPACE/effective-${BUILD_PROFILE}.config" \
            artifacts/dist/effective.config
          cp "$GITHUB_WORKSPACE/readelf-sections-${BUILD_PROFILE}.txt" \
            artifacts/dist/readelf-sections.txt
          cp "$GITHUB_WORKSPACE/kernel-build-${BUILD_PROFILE}.log" \
            artifacts/dist/build.log
          {
            echo "kernel_ref=$KERNEL_REF"
            echo "source_sha=$KERNEL_SOURCE_SHA"
            echo "effective_sha=$KERNEL_EFFECTIVE_SHA"
            echo "build_profile=$BUILD_PROFILE"
            echo "build_config=$ACTIVE_BUILD_CONFIG"
          } > artifacts/dist/build-metadata.txt

          find_dist_file() {
            local candidate
            for candidate in "$@"; do
              if [[ -f "$dist_dir/$candidate" ]]; then
                printf '%s' "$dist_dir/$candidate"
                return 0
              fi
            done
            for candidate in "$@"; do
              local found
              found="$(find "$dist_dir" -maxdepth 2 -type f -name "$candidate" \
                -print -quit 2>/dev/null || true)"
              if [[ -n "$found" ]]; then
                printf '%s' "$found"
                return 0
              fi
            done
            return 1
          }

          dtb_lahaina="$(find_dist_file lahaina.dtb lahaina || true)"
          dtb_v2="$(find_dist_file lahaina-v2.dtb v2.dtb v2 || true)"
          dtb_v21="$(find_dist_file lahaina-v2.1.dtb v2.1.dtb v2.1 || true)"
          if [[ -z "$dtb_lahaina" || -z "$dtb_v2" || -z "$dtb_v21" ]]; then
            echo "::error::One or more required Lahaina DTBs were not found"
            find "$dist_dir" -maxdepth 2 -type f \
              \( -name '*.dtb' -o -name 'lahaina' -o -name 'v2' -o -name 'v2.1' \) \
              -printf '%P\n' | sort || true
            exit 1
          fi

          cat "$dtb_lahaina" "$dtb_v21" "$dtb_v2" > artifacts/dist/dtb

          dtbo_path="$(find_dist_file dtbo.img || true)"
          if [[ -z "$dtbo_path" || ! -f "$dtbo_path" ]]; then
            echo "::error::Built dtbo.img was not found"
            exit 1
          fi
          cp "$dtbo_path" artifacts/dist/dtbo.img

          if [[ "$BUILD_PROFILE" == "plain" ]]; then
            cp "$image_path" "ak3/$KERNEL_IMAGE_NAME"
            cp artifacts/dist/dtb ak3/dtb
            cp artifacts/dist/dtbo.img ak3/dtbo.img

            package_name="AnyKernel3-OnePlus9Pro-A17-BPF-${BUILD_PROFILE}-${BUILD_TIME}.zip"
            (
              cd ak3
              zip -r9 "../artifacts/$package_name" . \
                -x '.git/*' '.github/*' 'README.md'
            )
            echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
            sha256sum "$image_path" artifacts/dist/dtb artifacts/dist/dtbo.img \
              "artifacts/$package_name" | tee artifacts/SHA256SUMS
          else
            # The container Kconfig intentionally changes exported-symbol CRCs.
            # A kernel-only AnyKernel ZIP would leave stock modules mismatched,
            # so publish a complete kernel+rebuilt-module bundle instead.
            bundle_dir=artifacts/container-bundle
            mkdir -p "$bundle_dir/modules"
            cp "$image_path" "$bundle_dir/$KERNEL_IMAGE_NAME"
            cp artifacts/dist/dtb artifacts/dist/dtbo.img \
              artifacts/dist/effective.config artifacts/dist/Module.symvers \
              artifacts/dist/build-metadata.txt "$bundle_dir/"
            find "$dist_dir" -maxdepth 1 -type f -name '*.ko' \
              -exec cp -t "$bundle_dir/modules" {} +

            module_count="$(find "$bundle_dir/modules" -type f -name '*.ko' | wc -l)"
            if [[ "$module_count" -eq 0 ]]; then
              echo "::error::Container bundle contains no rebuilt modules"
              exit 1
            fi
            {
              echo "This profile is not safe as a kernel-only flash."
              echo "Deploy the matching rebuilt module set with the Image."
              echo "module_count=$module_count"
            } > "$bundle_dir/DEPLOYMENT-NOTICE.txt"

            bundle_name="OnePlus9Pro-A17-BPF-containers-kernel-modules-${BUILD_TIME}.tar.zst"
            tar --zstd -cf "artifacts/$bundle_name" -C "$bundle_dir" .
            echo "CONTAINER_BUNDLE_NAME=$bundle_name" >> "$GITHUB_ENV"
            sha256sum "$image_path" artifacts/dist/dtb artifacts/dist/dtbo.img \
              "artifacts/$bundle_name" | tee artifacts/SHA256SUMS
          fi

          cp artifacts/SHA256SUMS artifacts/dist/SHA256SUMS

      - name: Upload kernel dist
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ env.BUILD_PROFILE }}-dist-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/dist
          if-no-files-found: error

      - name: Upload plain AnyKernel3
        if: env.BUILD_PROFILE == 'plain'
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-plain-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/artifacts/${{ env.PACKAGE_NAME }}
            kernel_workspace/artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Upload container kernel and rebuilt modules
        if: env.BUILD_PROFILE == 'containers'
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-containers-kernel-modules-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/artifacts/${{ env.CONTAINER_BUNDLE_NAME }}
            kernel_workspace/artifacts/SHA256SUMS
          if-no-files-found: error

'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

          rm -f .github/workflows/apply-ci-packaging-fix-once.yml
          git diff --check

      - name: Commit the workflow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/yun-kernel.yml \
            .github/workflows/apply-ci-packaging-fix-once.yml
          git commit -m "ci: block unsafe kernel-only container packages"
          git push origin HEAD:fix/a17-bpf-ci-current-branch
