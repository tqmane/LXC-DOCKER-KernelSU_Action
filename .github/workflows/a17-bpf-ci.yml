name: Validate Android 17 BPF build profiles

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/a17-bpf-ci.yml'
      - '.github/workflows/yun-kernel.yml'
      - 'config.env'
      - 'README.md'
      - 'README_EN.md'

permissions:
  contents: read

concurrency:
  group: a17-bpf-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plain:
    name: Plain Android 17 BPF
    uses: ./.github/workflows/yun-kernel.yml
    with:
      build_profile: plain
      # Validate the BTF alignment fix and the container-profile ABI cleanup
      # before their kernel PRs are merged. Manual/default builds still use the
      # production branch from config.env.
      kernel_ref: fix/a17-container-kmi
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_PAT || secrets.PAT }}

  containers:
    name: LXC + Docker + KVM
    uses: ./.github/workflows/yun-kernel.yml
    with:
      build_profile: containers
      kernel_ref: fix/a17-container-kmi
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_PAT || secrets.PAT }}

  module-abi:
    name: Validate module ABI and packaging policy
    needs:
      - plain
      - containers
    runs-on: ubuntu-24.04

    steps:
      - name: Install module inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y kmod

      - name: Download plain dist
        uses: actions/download-artifact@v4
        with:
          pattern: OnePlus9Pro-A17-BPF-plain-dist-*
          path: artifacts/plain
          merge-multiple: true

      - name: Download container dist
        uses: actions/download-artifact@v4
        with:
          pattern: OnePlus9Pro-A17-BPF-containers-dist-*
          path: artifacts/containers
          merge-multiple: true

      - name: Validate each module set and report cross-profile compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          roots = {
              "plain": Path("artifacts/plain"),
              "containers": Path("artifacts/containers"),
          }
          report_path = Path("module-kmi-report.json")

          def module_index(root: Path) -> dict[str, Path]:
              return {
                  module.relative_to(root).as_posix(): module
                  for module in sorted(root.rglob("*.ko"))
              }

          def command_output(command: list[str], module: Path) -> str:
              proc = subprocess.run(
                  [*command, str(module)],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if proc.returncode != 0:
                  raise RuntimeError(
                      f"failed to inspect {module}: "
                      f"{proc.stderr.strip() or proc.stdout.strip()}"
                  )
              return proc.stdout.strip()

          def modversions(module: Path) -> dict[str, str]:
              versions: dict[str, str] = {}
              output = command_output(["modprobe", "--dump-modversions"], module)
              for raw in output.splitlines():
                  fields = raw.split()
                  if len(fields) == 2:
                      crc, symbol = fields
                      versions[symbol] = crc.lower()
              return versions

          def vermagic(module: Path) -> str:
              return command_output(["modinfo", "-F", "vermagic"], module)

          def read_symvers(root: Path) -> dict[str, str]:
              path = root / "Module.symvers"
              if not path.is_file():
                  raise SystemExit(f"missing {path}")
              result: dict[str, str] = {}
              for raw in path.read_text(errors="replace").splitlines():
                  fields = raw.split()
                  if len(fields) >= 2:
                      result[fields[1]] = fields[0].lower()
              return result

          modules = {name: module_index(root) for name, root in roots.items()}
          if not modules["plain"] or not modules["containers"]:
              raise SystemExit("both dist artifacts must contain their rebuilt .ko modules")

          self_mismatches: dict[str, dict[str, dict[str, str | None]]] = {
              "plain": {},
              "containers": {},
          }
          symvers = {name: read_symvers(root) for name, root in roots.items()}

          # Hard gate: every rebuilt module must agree with the Module.symvers
          # generated by its own kernel profile.
          for profile, profile_modules in modules.items():
              for relative_path, module in sorted(profile_modules.items()):
                  bad: dict[str, dict[str, str | None]] = {}
                  for symbol, module_crc in modversions(module).items():
                      kernel_crc = symvers[profile].get(symbol)
                      if kernel_crc != module_crc:
                          bad[symbol] = {
                              "module": module_crc,
                              "kernel": kernel_crc,
                          }
                  if bad:
                      self_mismatches[profile][relative_path] = bad

          if self_mismatches["plain"] or self_mismatches["containers"]:
              report = {
                  "status": "failed-self-consistency",
                  "self_mismatches": self_mismatches,
              }
              report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
              print(report_path.read_text())
              raise SystemExit("a rebuilt module does not match its own kernel Module.symvers")

          # Informational cross-profile comparison. Different Kconfig profiles
          # can legitimately produce different exported-symbol CRCs. A mismatch
          # means a kernel-only AnyKernel package is unsafe for the container
          # profile and its matching rebuilt modules must be deployed with it.
          missing_from_containers = sorted(
              set(modules["plain"]) - set(modules["containers"])
          )
          extra_in_containers = sorted(
              set(modules["containers"]) - set(modules["plain"])
          )
          changed_vermagic: dict[str, dict[str, str]] = {}
          changed_requirements: dict[str, dict[str, object]] = {}
          matching = sorted(set(modules["plain"]) & set(modules["containers"]))

          for relative_path in matching:
              plain_module = modules["plain"][relative_path]
              container_module = modules["containers"][relative_path]
              plain_magic = vermagic(plain_module)
              container_magic = vermagic(container_module)
              if plain_magic != container_magic:
                  changed_vermagic[relative_path] = {
                      "plain": plain_magic,
                      "containers": container_magic,
                  }

              plain_versions = modversions(plain_module)
              container_versions = modversions(container_module)
              changes: dict[str, dict[str, str | None]] = {}
              for symbol in sorted(set(plain_versions) | set(container_versions)):
                  plain_crc = plain_versions.get(symbol)
                  container_crc = container_versions.get(symbol)
                  if plain_crc != container_crc:
                      changes[symbol] = {
                          "plain": plain_crc,
                          "containers": container_crc,
                      }
              if changes:
                  changed_requirements[relative_path] = {"symbols": changes}

          kernel_only_compatible = not (
              missing_from_containers
              or changed_vermagic
              or changed_requirements
          )
          status = (
              "kernel-only-compatible"
              if kernel_only_compatible
              else "profile-specific-modules-required"
          )
          report = {
              "status": status,
              "plain_module_count": len(modules["plain"]),
              "container_module_count": len(modules["containers"]),
              "inspected_matching_modules": len(matching),
              "self_consistency": "passed",
              "kernel_only_container_flash_safe": kernel_only_compatible,
              "missing_from_containers": missing_from_containers,
              "extra_in_containers": extra_in_containers,
              "changed_vermagic": changed_vermagic,
              "changed_modversion_requirements": changed_requirements,
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(report_path.read_text())

          if not kernel_only_compatible:
              print(
                  "::warning::The container profile has a different module CRC set. "
                  "Its build is valid with the rebuilt modules in its dist, but a "
                  "kernel-only AnyKernel package must not be published."
              )
          PY

      - name: Upload module ABI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-module-KMI-report
          path: module-kmi-report.json
          if-no-files-found: error
