name: Validate Android 17 BPF build profiles

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/a17-bpf-ci.yml'
      - '.github/workflows/yun-kernel.yml'
      - '.github/workflows/blank.yml'
      - 'config.env'
      - 'README.md'
      - 'README_EN.md'

permissions:
  contents: read

concurrency:
  group: a17-bpf-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plain:
    name: Plain Android 17 BPF
    uses: ./.github/workflows/yun-kernel.yml
    with:
      build_profile: plain
      # Test the kernel-side BTF alignment fix before it is merged into the
      # production branch. The reusable workflow itself defaults to production.
      kernel_ref: fix/btf-ids-arm64-alignment
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_PAT || secrets.PAT }}

  containers:
    name: LXC + Docker + KVM
    uses: ./.github/workflows/yun-kernel.yml
    with:
      build_profile: containers
      kernel_ref: fix/btf-ids-arm64-alignment
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_PAT || secrets.PAT }}

  stock-module-kmi:
    name: Compare matching module KMI
    needs:
      - plain
      - containers
    runs-on: ubuntu-24.04

    steps:
      - name: Install module inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y kmod

      - name: Download plain dist
        uses: actions/download-artifact@v4
        with:
          pattern: OnePlus9Pro-A17-BPF-plain-dist-*
          path: artifacts/plain
          merge-multiple: true

      - name: Download container dist
        uses: actions/download-artifact@v4
        with:
          pattern: OnePlus9Pro-A17-BPF-containers-dist-*
          path: artifacts/containers
          merge-multiple: true

      - name: Compare module version requirements and vermagic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path

          plain_root = Path("artifacts/plain")
          container_root = Path("artifacts/containers")
          report_path = Path("module-kmi-report.json")

          def module_index(root: Path) -> dict[str, Path]:
              return {
                  module.relative_to(root).as_posix(): module
                  for module in sorted(root.rglob("*.ko"))
              }

          def command_output(command: list[str], module: Path) -> str:
              proc = subprocess.run(
                  [*command, str(module)],
                  check=False,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if proc.returncode != 0:
                  raise RuntimeError(
                      f"failed to inspect {module}: "
                      f"{proc.stderr.strip() or proc.stdout.strip()}"
                  )
              return proc.stdout.strip()

          def modversions(module: Path) -> dict[str, str]:
              versions: dict[str, str] = {}
              output = command_output(["modprobe", "--dump-modversions"], module)
              for raw in output.splitlines():
                  fields = raw.split()
                  if len(fields) == 2:
                      crc, symbol = fields
                      versions[symbol] = crc.lower()
              return versions

          def vermagic(module: Path) -> str:
              return command_output(["modinfo", "-F", "vermagic"], module)

          plain_modules = module_index(plain_root)
          container_modules = module_index(container_root)

          if not plain_modules or not container_modules:
              report = {
                  "status": "skipped-no-modules-in-dist",
                  "plain_module_count": len(plain_modules),
                  "container_module_count": len(container_modules),
                  "note": (
                      "The Android kernel dist did not contain comparable .ko files. "
                      "The kernel builds are valid, but stock partition module KMI "
                      "must be checked separately before flashing."
                  ),
              }
              report_path.write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n"
              )
              print("::warning::No matching .ko set in dist; KMI comparison skipped")
              print(report_path.read_text())
              raise SystemExit(0)

          missing_modules: list[str] = []
          changed_requirements: dict[str, dict[str, object]] = {}
          changed_vermagic: dict[str, dict[str, str]] = {}
          inspected = 0

          for relative_path, plain_module in sorted(plain_modules.items()):
              container_module = container_modules.get(relative_path)
              if container_module is None:
                  missing_modules.append(relative_path)
                  continue

              plain_versions = modversions(plain_module)
              container_versions = modversions(container_module)
              plain_vermagic = vermagic(plain_module)
              container_vermagic = vermagic(container_module)
              inspected += 1

              if plain_vermagic != container_vermagic:
                  changed_vermagic[relative_path] = {
                      "plain": plain_vermagic,
                      "containers": container_vermagic,
                  }

              symbols = sorted(set(plain_versions) | set(container_versions))
              changes: dict[str, dict[str, str | None]] = {}
              for symbol in symbols:
                  plain_crc = plain_versions.get(symbol)
                  container_crc = container_versions.get(symbol)
                  if plain_crc != container_crc:
                      changes[symbol] = {
                          "plain": plain_crc,
                          "containers": container_crc,
                      }

              if changes:
                  changed_requirements[relative_path] = {
                      "plain_path": str(plain_module),
                      "container_path": str(container_module),
                      "symbols": changes,
                  }

          extra_modules = sorted(set(container_modules) - set(plain_modules))
          report = {
              "status": "passed" if not (
                  missing_modules or changed_vermagic or changed_requirements
              ) else "failed",
              "plain_module_count": len(plain_modules),
              "container_module_count": len(container_modules),
              "inspected_matching_modules": inspected,
              "missing_from_container": missing_modules,
              "extra_in_container": extra_modules,
              "changed_vermagic": changed_vermagic,
              "changed_modversion_requirements": changed_requirements,
          }
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n"
          )
          print(report_path.read_text())

          if missing_modules or changed_vermagic or changed_requirements:
              raise SystemExit(
                  "container profile is not compatible with the matching plain module set"
              )
          PY

      - name: Upload KMI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-module-KMI-report
          path: module-kmi-report.json
          if-no-files-found: warn
