name: BPF LSM OnePlus 9 Pro CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bpf-lsm-ci.yml'
      - '.github/workflows/yun-kernel.yml'
      - 'config.env'

jobs:
  build-kernel:
    uses: ./.github/workflows/yun-kernel.yml
    secrets:
      PRIVATE_REPO_TOKEN: ${{ secrets.GH_PAT }}
