name: Apply production kernel ref to PR CI once

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-production-ci-ref-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/a17-bpf-ci-current-branch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/a17-bpf-ci-current-branch
          fetch-depth: 0

      - name: Remove merged kernel-fix branch overrides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/a17-bpf-ci.yml')
          text = path.read_text()

          plain_override = '''      # Validate the BTF alignment fix and the container-profile ABI cleanup
      # before their kernel PRs are merged. Manual/default builds still use the
      # production branch from config.env.
      kernel_ref: fix/a17-container-kmi
'''
          container_override = '''      kernel_ref: fix/a17-container-kmi
'''

          if text.count(plain_override) != 1:
              raise SystemExit('unexpected plain kernel_ref override layout')
          text = text.replace(plain_override, '', 1)

          if text.count(container_override) != 1:
              raise SystemExit('unexpected container kernel_ref override layout')
          text = text.replace(container_override, '', 1)

          path.write_text(text)
          PY

          rm -f .github/workflows/apply-production-ci-ref-once.yml
          git diff --check

      - name: Commit production-ref CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/a17-bpf-ci.yml \
            .github/workflows/apply-production-ci-ref-once.yml
          git commit -m "ci: validate the merged production kernel branch"
          git push origin HEAD:fix/a17-bpf-ci-current-branch
