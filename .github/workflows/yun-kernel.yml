name: Build OnePlus 9 Pro Android 17 BPF kernel

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: Kernel profile to build
        required: true
        default: plain
        type: choice
        options:
          - plain
          - containers
  workflow_call:
    inputs:
      build_profile:
        description: Kernel profile to build
        required: false
        default: plain
        type: string
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: OnePlus 9 Pro / ${{ inputs.build_profile }}
    runs-on: ubuntu-24.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Select build profile
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/config.env"
          set +a

          profile="${{ inputs.build_profile }}"
          profile="${profile:-plain}"

          for key in \
            MANIFEST_REPO MANIFEST_BRANCH \
            PLAIN_KERNEL_REF PLAIN_KERNEL_EXPECTED_SHA \
            CONTAINER_KERNEL_REF CONTAINER_KERNEL_EXPECTED_SHA \
            PLAIN_BUILD_CONFIG CONTAINER_BUILD_CONFIG VARIANT LTO BUILD_KERNEL \
            KERNEL_IMAGE_NAME ENABLE_CCACHE; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::Missing $key in config.env"
              exit 1
            fi
          done

          case "$profile" in
            plain)
              kernel_ref="$PLAIN_KERNEL_REF"
              kernel_expected_sha="$PLAIN_KERNEL_EXPECTED_SHA"
              active_build_config="$PLAIN_BUILD_CONFIG"
              ;;
            containers)
              kernel_ref="$CONTAINER_KERNEL_REF"
              kernel_expected_sha="$CONTAINER_KERNEL_EXPECTED_SHA"
              active_build_config="$CONTAINER_BUILD_CONFIG"
              ;;
            *)
              echo "::error::Unsupported build profile: $profile"
              exit 1
              ;;
          esac

          if [[ ! "$kernel_expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid expected kernel SHA: $kernel_expected_sha"
            exit 1
          fi

          {
            echo "MANIFEST_REPO=$MANIFEST_REPO"
            echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"
            echo "KERNEL_REF=$kernel_ref"
            echo "KERNEL_EXPECTED_SHA=$kernel_expected_sha"
            echo "ACTIVE_BUILD_CONFIG=$active_build_config"
            echo "VARIANT=$VARIANT"
            echo "LTO=$LTO"
            echo "BUILD_KERNEL=$BUILD_KERNEL"
            echo "KERNEL_IMAGE_NAME=$KERNEL_IMAGE_NAME"
            echo "ENABLE_CCACHE=$ENABLE_CCACHE"
            echo "BUILD_PROFILE=$profile"
            echo "BUILD_TIME=$(TZ=Asia/Tokyo date '+%Y%m%d-%H%M')"
          } >> "$GITHUB_ENV"

          echo "Selected profile: $profile"
          echo "Kernel ref: $kernel_ref"
          echo "Expected kernel SHA: $kernel_expected_sha"
          echo "Build config: $active_build_config"

      - name: Free build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies and repo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential ccache curl \
            device-tree-compiler flex git libelf-dev liblz4-tool libncurses-dev \
            libssl-dev lz4 python3 rsync unzip zip zstd

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure private repository authentication
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::error::A PRIVATE_REPO_TOKEN (or legacy GH_PAT) secret is required to read the private kernel and SukiSU repositories."
            exit 1
          fi

          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' \
            "$PRIVATE_REPO_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      - name: Initialize and sync kernel manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH"
          repo sync --force-sync --no-clone-bundle --current-branch \
            --no-tags -j"$(nproc --all)"

          test -d kernel/msm-5.4
          test -d modules_devicetree
          test -d ak3

          # repo names remotes after the manifest's <remote> entry ("tqmane")
          # rather than always creating "origin". Discover it instead of
          # assuming a conventional clone layout.
          mapfile -t kernel_remotes < <(git -C kernel/msm-5.4 remote)
          kernel_remote="${kernel_remotes[0]:-}"
          if [[ -z "$kernel_remote" ]]; then
            echo "::error::The manifest kernel checkout has no Git remote"
            exit 1
          fi

          # The manifest supplies all dependencies. Select only the requested
          # kernel profile after sync; no Action-side source patching or KSU
          # installation is performed.
          git -C kernel/msm-5.4 fetch "$kernel_remote" "$KERNEL_REF" --depth=1
          git -C kernel/msm-5.4 checkout --detach FETCH_HEAD

          actual_sha="$(git -C kernel/msm-5.4 rev-parse HEAD)"
          if [[ "$actual_sha" != "$KERNEL_EXPECTED_SHA" ]]; then
            echo "::error::Kernel branch moved: expected $KERNEL_EXPECTED_SHA, got $actual_sha"
            exit 1
          fi

          git -C kernel/msm-5.4 submodule sync --recursive
          git -C kernel/msm-5.4 submodule update --init --recursive --depth=1

          echo "Kernel source: $actual_sha"
          echo "Kernel branch requested: $KERNEL_REF"
          echo "Kernel remote used: $kernel_remote"

          if [[ ! -f "$ACTIVE_BUILD_CONFIG" ]]; then
            echo "::error::BUILD_CONFIG does not exist: $ACTIVE_BUILD_CONFIG"
            exit 1
          fi

      - name: Configure ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: oneplus9pro-a17-bpf-${{ env.BUILD_PROFILE }}
          max-size: 2G

      - name: Build with Android kernel build framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          BUILD_CONFIG="$ACTIVE_BUILD_CONFIG" \
          VARIANT="$VARIANT" \
          LTO="$LTO" \
          BUILD_KERNEL="$BUILD_KERNEL" \
          build/build.sh

      - name: Validate effective kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          config_path="$(find out -path '*/kernel/msm-5.4/.config' \
            -type f -print -quit 2>/dev/null || true)"
          if [[ -z "$config_path" || ! -f "$config_path" ]]; then
            echo "::error::Built kernel .config was not found"
            exit 1
          fi

          require_y() {
            local symbol="$1"
            grep -qx "${symbol}=y" "$config_path" || {
              echo "::error::$symbol is not enabled in $BUILD_PROFILE profile"
              exit 1
            }
          }

          require_disabled() {
            local symbol="$1"
            if grep -Eq "^${symbol}=(y|m)$" "$config_path"; then
              echo "::error::$symbol must be disabled in $BUILD_PROFILE profile"
              exit 1
            fi
          }

          for symbol in \
            CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_BPF_JIT_ALWAYS_ON \
            CONFIG_BPF_LSM CONFIG_DEBUG_INFO_BTF; do
            require_y "$symbol"
          done
          require_disabled CONFIG_FUNCTION_TRACER

          case "$BUILD_PROFILE" in
            plain)
              require_disabled CONFIG_PID_NS
              require_disabled CONFIG_KVM
              ;;
            containers)
              for symbol in \
                CONFIG_IPC_NS CONFIG_PID_NS CONFIG_NET_NS CONFIG_SYSVIPC \
                CONFIG_POSIX_MQUEUE CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS \
                CONFIG_SECCOMP_FILTER CONFIG_FHANDLE CONFIG_OVERLAY_FS \
                CONFIG_BRIDGE_NETFILTER CONFIG_VETH CONFIG_KVM CONFIG_VHOST_NET; do
                require_y "$symbol"
              done
              require_disabled CONFIG_USER_NS
              require_disabled CONFIG_FAIR_GROUP_SCHED
              require_disabled CONFIG_RT_GROUP_SCHED
              ;;
          esac

          cp "$config_path" "$GITHUB_WORKSPACE/effective-${BUILD_PROFILE}.config"
          echo "Effective config: $config_path"

      - name: Collect kernel and AnyKernel3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p artifacts

          dist_dir="$(find out -type d -name dist -print -quit 2>/dev/null || true)"
          if [[ -z "$dist_dir" || ! -d "$dist_dir" ]]; then
            echo "::error::Kernel build completed without a dist directory"
            exit 1
          fi

          find_output() {
            local name="$1"
            local found
            found="$(find "$dist_dir" -maxdepth 1 -type f -name "$name" \
              -print -quit 2>/dev/null || true)"
            if [[ -z "$found" ]]; then
              found="$(find out -type f -name "$name" \
                -print -quit 2>/dev/null || true)"
            fi
            printf '%s' "$found"
          }

          image_path="$(find_output "$KERNEL_IMAGE_NAME")"
          if [[ -z "$image_path" || ! -f "$image_path" ]]; then
            echo "::error::Built kernel image '$KERNEL_IMAGE_NAME' was not found"
            exit 1
          fi

          cp -a "$dist_dir" artifacts/dist
          cp "$GITHUB_WORKSPACE/effective-${BUILD_PROFILE}.config" \
            artifacts/dist/effective.config
          cp "$image_path" "ak3/$KERNEL_IMAGE_NAME"

          dtb_lahaina="$(find_output lahaina.dtb)"
          dtb_v2="$(find_output lahaina-v2.dtb)"
          dtb_v21="$(find_output lahaina-v2.1.dtb)"
          if [[ -z "$dtb_lahaina" || -z "$dtb_v2" || -z "$dtb_v21" ]]; then
            echo "::error::One or more required DTBs were not found"
            find "$dist_dir" -maxdepth 1 -type f -name '*.dtb' \
              -printf '%f\n' | sort || true
            exit 1
          fi

          # Keep the order used by the boot-tested OnePlus 9 Pro package.
          cat "$dtb_lahaina" "$dtb_v21" "$dtb_v2" > ak3/dtb
          cp ak3/dtb artifacts/dist/dtb

          dtbo_path="$(find_output dtbo.img)"
          if [[ -z "$dtbo_path" || ! -f "$dtbo_path" ]]; then
            echo "::error::Built dtbo.img was not found"
            exit 1
          fi
          cp "$dtbo_path" ak3/dtbo.img
          cp "$dtbo_path" artifacts/dist/dtbo.img

          package_name="AnyKernel3-OnePlus9Pro-A17-BPF-${BUILD_PROFILE}-${BUILD_TIME}.zip"
          (
            cd ak3
            zip -r9 "../artifacts/$package_name" . \
              -x '.git/*' '.github/*' 'README.md'
          )

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          echo "Kernel image: $image_path"
          echo "Combined DTB size: $(stat -c '%s' ak3/dtb) bytes"
          echo "DTBO image: $dtbo_path ($(stat -c '%s' ak3/dtbo.img) bytes)"
          sha256sum "$image_path" ak3/dtb ak3/dtbo.img "artifacts/$package_name"

      - name: Upload kernel dist
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ env.BUILD_PROFILE }}-dist-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/dist
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ env.BUILD_PROFILE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/${{ env.PACKAGE_NAME }}
          if-no-files-found: error
