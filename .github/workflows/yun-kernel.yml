name: Build OnePlus 9 Pro LXC/Docker kernel

on:
  watch:
    types: [started]
  workflow_call:
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false

jobs:
  build:
    name: OnePlus 9 Pro / no KernelSU / LXC + Docker
    runs-on: ubuntu-latest
    if: github.event_name != 'watch' || github.event.repository.owner.id == github.event.sender.id

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Load build configuration
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/config.env"
          set +a

          for key in \
            MANIFEST_REPO MANIFEST_BRANCH KERNEL_PROJECT KERNEL_PATH KERNEL_BRANCH \
            BUILD_CONFIG VARIANT LTO BUILD_KERNEL KERNEL_IMAGE_NAME CONFIG_FRAGMENT \
            LXC_DOCKER LXC_PATCH ANDROID_PARANOID_NETWORK_OFF ENABLE_KVM ENABLE_CCACHE; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::Missing $key in config.env"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done

          echo "BUILD_TIME=$(TZ=Asia/Tokyo date '+%Y%m%d-%H%M')" >> "$GITHUB_ENV"

      - name: Free build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies and repo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential ccache curl \
            device-tree-compiler flex git libelf-dev liblz4-tool libncurses-dev \
            libssl-dev lz4 python3 rsync unzip zip zstd

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure private repository authentication
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::error::PRIVATE_REPO_TOKEN is required because the manifest uses tqmane/android_kernel_oppo_sm8350-private. Add a fine-grained PAT with read access to that repository as an Actions secret named PRIVATE_REPO_TOKEN."
            exit 1
          fi

          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_REPO_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      - name: Initialize manifest and force non-KernelSU kernel branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH"

          # The source manifest currently points at the *_sukisu branch and syncs
          # its KernelSU submodule. Keep the manifest as the source of truth for
          # build tools/modules/device tree/AnyKernel3, but replace only the
          # kernel project with the clean non-KSU branch requested by this action.
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/no-kernelsu.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="$KERNEL_PROJECT" />
            <project
                name="$KERNEL_PROJECT"
                path="$KERNEL_PATH"
                revision="$KERNEL_BRANCH"
                remote="tqmane"
                clone-depth="1" />
          </manifest>
          EOF

          repo sync --force-sync --no-clone-bundle --current-branch --no-tags -j"$(nproc --all)"

      - name: Verify KernelSU is absent
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [[ -e "$KERNEL_PATH/KernelSU" || -e "$KERNEL_PATH/drivers/kernelsu" ]]; then
            echo "::error::KernelSU content is still present after sync. Refusing to build."
            exit 1
          fi

          if [[ -f "$KERNEL_PATH/.gitmodules" ]] && grep -qi 'KernelSU\|SukiSU' "$KERNEL_PATH/.gitmodules"; then
            echo "::error::KernelSU/SukiSU submodule is still configured. Refusing to build."
            exit 1
          fi

          echo "Kernel source: $(git -C "$KERNEL_PATH" rev-parse HEAD)"
          echo "KernelSU/SukiSU: absent"

      - name: Enable LXC and Docker kernel configuration
        if: env.LXC_DOCKER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [[ ! -f "$CONFIG_FRAGMENT" ]]; then
            echo "::error::Config fragment not found: $CONFIG_FRAGMENT"
            exit 1
          fi

          curl -fL \
            https://github.com/wu17481748/lxc-docker/releases/download/lxc-docker-2config/LXC-DOCKER-OPEN-CONFIG.sh \
            -o /tmp/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x /tmp/LXC-DOCKER-OPEN-CONFIG.sh
          /tmp/LXC-DOCKER-OPEN-CONFIG.sh "$CONFIG_FRAGMENT" -w

      - name: Apply LXC runtime patches
        if: env.LXC_PATCH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          curl -fL \
            https://github.com/fate-think/LXC-DOCKER-KernelSU_Action/releases/download/1.0.0/runcpatch.sh \
            -o /tmp/runcpatch.sh
          chmod +x /tmp/runcpatch.sh

          if [[ -f "$KERNEL_PATH/kernel/cgroup.c" ]]; then
            /tmp/runcpatch.sh "$KERNEL_PATH/kernel/cgroup.c"
          fi
          if [[ -f "$KERNEL_PATH/kernel/cgroup/cgroup.c" ]]; then
            /tmp/runcpatch.sh "$KERNEL_PATH/kernel/cgroup/cgroup.c"
          fi

          if [[ -f "$KERNEL_PATH/net/netfilter/xt_qtaguid.c" ]]; then
            PATCH_FILE="$GITHUB_WORKSPACE/patch/xt_qtaguid.patch"
            if patch --dry-run -d "$KERNEL_PATH" -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
              patch -d "$KERNEL_PATH" -p1 < "$PATCH_FILE"
            elif patch -R --dry-run -d "$KERNEL_PATH" -p1 < "$PATCH_FILE" >/dev/null 2>&1; then
              echo "xt_qtaguid LXC patch is already applied"
            else
              echo "::error::xt_qtaguid LXC patch does not apply cleanly to this kernel branch"
              exit 1
            fi
          fi

      - name: Disable Android paranoid network
        if: env.ANDROID_PARANOID_NETWORK_OFF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "$CONFIG_FRAGMENT"
          echo '# CONFIG_ANDROID_PARANOID_NETWORK is not set' >> "$CONFIG_FRAGMENT"

      - name: Enable KVM configuration
        if: env.ENABLE_KVM == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          cat >> "$CONFIG_FRAGMENT" <<'EOF'
          CONFIG_VIRTUALIZATION=y
          CONFIG_KVM=y
          CONFIG_VHOST_NET=y
          CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y
          EOF

      - name: Configure ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: oneplus9pro-lxc-docker-no-ksu
          max-size: 2G

      - name: Build with Android kernel build framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [[ ! -f "$BUILD_CONFIG" ]]; then
            echo "::error::BUILD_CONFIG does not exist: $BUILD_CONFIG"
            exit 1
          fi

          BUILD_CONFIG="$BUILD_CONFIG" \
          VARIANT="$VARIANT" \
          LTO="$LTO" \
          BUILD_KERNEL="$BUILD_KERNEL" \
          build/build.sh

      - name: Collect kernel and AnyKernel3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p artifacts

          DIST_DIR="$(find out -type d -name dist -print -quit 2>/dev/null || true)"
          if [[ -z "$DIST_DIR" || ! -d "$DIST_DIR" ]]; then
            echo "::error::Kernel build completed without a dist directory"
            find out -maxdepth 4 -type f 2>/dev/null | head -200 || true
            exit 1
          fi

          IMAGE_PATH="$(find "$DIST_DIR" -maxdepth 1 -type f -name "$KERNEL_IMAGE_NAME" -print -quit)"
          if [[ -z "$IMAGE_PATH" ]]; then
            IMAGE_PATH="$(find out -type f -name "$KERNEL_IMAGE_NAME" -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$IMAGE_PATH" || ! -f "$IMAGE_PATH" ]]; then
            echo "::error::Built kernel image '$KERNEL_IMAGE_NAME' was not found"
            find "$DIST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          cp -a "$DIST_DIR" artifacts/dist

          if [[ ! -d ak3 ]]; then
            echo "::error::AnyKernel3 project from the manifest is missing"
            exit 1
          fi

          cp "$IMAGE_PATH" "ak3/$KERNEL_IMAGE_NAME"
          (
            cd ak3
            zip -r9 "../artifacts/AnyKernel3-OnePlus9Pro-LXC-Docker-${BUILD_TIME}.zip" . \
              -x '.git/*' '.github/*' 'README.md'
          )

          echo "DIST_DIR=$DIST_DIR" >> "$GITHUB_ENV"
          echo "Kernel image: $IMAGE_PATH"
          ls -lh artifacts/*.zip

      - name: Upload kernel dist
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-LXC-Docker-dist-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/dist
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-OnePlus9Pro-LXC-Docker-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/AnyKernel3-OnePlus9Pro-LXC-Docker-${{ env.BUILD_TIME }}.zip
          if-no-files-found: error
