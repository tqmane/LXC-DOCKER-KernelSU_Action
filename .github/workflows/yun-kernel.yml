name: Build OnePlus 9 Pro Android 17 BPF kernel

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: Kernel profile to build
        required: true
        default: plain
        type: choice
        options:
          - plain
          - containers
      kernel_ref:
        description: Optional kernel branch, tag, or commit override
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      build_profile:
        description: Kernel profile to build
        required: false
        default: plain
        type: string
      kernel_ref:
        description: Optional kernel branch, tag, or commit override
        required: false
        default: ''
        type: string
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: a17-bpf-${{ github.workflow }}-${{ github.ref }}-${{ inputs.build_profile }}
  cancel-in-progress: true

jobs:
  build:
    name: OnePlus 9 Pro / ${{ inputs.build_profile }}
    runs-on: ubuntu-24.04

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Select build profile
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.build_profile }}
          REQUESTED_KERNEL_REF: ${{ inputs.kernel_ref }}
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/config.env"
          set +a

          profile="${REQUESTED_PROFILE:-plain}"
          kernel_ref="${REQUESTED_KERNEL_REF:-}"
          if [[ -z "$kernel_ref" ]]; then
            kernel_ref="$KERNEL_REF"
          fi

          for key in \
            MANIFEST_REPO MANIFEST_BRANCH KERNEL_REF \
            PLAIN_BUILD_CONFIG CONTAINER_BUILD_CONFIG VARIANT LTO BUILD_KERNEL \
            KERNEL_IMAGE_NAME ENABLE_CCACHE; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::Missing $key in config.env"
              exit 1
            fi
          done

          if [[ ! "$kernel_ref" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "::error::Invalid kernel ref: $kernel_ref"
            exit 1
          fi

          case "$profile" in
            plain)
              active_build_config="$PLAIN_BUILD_CONFIG"
              ;;
            containers)
              active_build_config="$CONTAINER_BUILD_CONFIG"
              ;;
            *)
              echo "::error::Unsupported build profile: $profile"
              exit 1
              ;;
          esac

          {
            echo "MANIFEST_REPO=$MANIFEST_REPO"
            echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"
            echo "KERNEL_REF=$kernel_ref"
            echo "ACTIVE_BUILD_CONFIG=$active_build_config"
            echo "VARIANT=$VARIANT"
            echo "LTO=$LTO"
            echo "BUILD_KERNEL=$BUILD_KERNEL"
            echo "KERNEL_IMAGE_NAME=$KERNEL_IMAGE_NAME"
            echo "ENABLE_CCACHE=$ENABLE_CCACHE"
            echo "BUILD_PROFILE=$profile"
            echo "BUILD_TIME=$(TZ=Asia/Tokyo date '+%Y%m%d-%H%M')"
          } >> "$GITHUB_ENV"

          echo "Selected profile: $profile"
          echo "Kernel ref: $kernel_ref"
          echo "Build config: $active_build_config"

      - name: Free build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies and repo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils binutils-aarch64-linux-gnu bison build-essential ccache curl \
            device-tree-compiler flex git libelf-dev liblz4-tool libncurses-dev \
            libssl-dev lz4 python3 rsync unzip zip zstd

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure private repository authentication
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_PAT || secrets.PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::error::PRIVATE_REPO_TOKEN (or legacy GH_PAT/PAT) is required to read the private kernel and SukiSU repositories."
            exit 1
          fi

          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' \
            "$PRIVATE_REPO_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      - name: Initialize and sync kernel manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH"
          if ! repo sync --force-sync --no-clone-bundle --current-branch \
              --no-tags -j"$(nproc --all)"; then
            echo "Parallel repo sync failed; retrying serially for a precise error"
            repo sync --force-sync --no-clone-bundle --current-branch \
              --no-tags -j1 --fail-fast
          fi

          test -d kernel/msm-5.4
          test -d modules_devicetree
          test -d ak3

          mapfile -t kernel_remotes < <(git -C kernel/msm-5.4 remote)
          kernel_remote="${kernel_remotes[0]:-}"
          if [[ -z "$kernel_remote" ]]; then
            echo "::error::The manifest kernel checkout has no Git remote"
            exit 1
          fi

          # The manifest checks out the current production branch. An explicit
          # ref override is used only to validate an in-flight kernel fix PR.
          git -C kernel/msm-5.4 fetch "$kernel_remote" "$KERNEL_REF" --depth=1
          git -C kernel/msm-5.4 checkout --detach FETCH_HEAD
          source_sha="$(git -C kernel/msm-5.4 rev-parse HEAD)"

          git -C kernel/msm-5.4 submodule sync --recursive
          GIT_TERMINAL_PROMPT=0 git -C kernel/msm-5.4 submodule update \
            --init --recursive --force

          if [[ "$BUILD_PROFILE" == "containers" ]]; then
            kabi_script="scripts/gki/apply_container_kabi.py"
            if [[ ! -f "kernel/msm-5.4/$kabi_script" ]]; then
              echo "::error::Missing container KABI adaptation: $kabi_script"
              exit 1
            fi

            (
              cd kernel/msm-5.4
              python3 "$kabi_script"
              git diff --check
              git config user.name github-actions[bot]
              git config user.email \
                41898282+github-actions[bot]@users.noreply.github.com
              git add include/linux/sched.h include/linux/sched/user.h
              if ! git diff --cached --quiet; then
                GIT_AUTHOR_DATE=2000-01-01T00:00:00Z \
                GIT_COMMITTER_DATE=2000-01-01T00:00:00Z \
                  git commit --no-gpg-sign \
                    -m "ANDROID: kabi: preserve container task and user layouts"
              fi
            )

            grep -q 'ANDROID_KABI_USE(3, struct sysv_sem sysvsem)' \
              kernel/msm-5.4/include/linux/sched.h
            grep -q 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' \
              kernel/msm-5.4/include/linux/sched/user.h
          fi

          tracked_status="$(git -C kernel/msm-5.4 status \
            --porcelain --untracked-files=no)"
          if [[ -n "$tracked_status" ]]; then
            echo "::error::Tracked kernel source is not clean"
            printf '%s\n' "$tracked_status"
            exit 1
          fi

          effective_sha="$(git -C kernel/msm-5.4 rev-parse HEAD)"
          {
            echo "KERNEL_SOURCE_SHA=$source_sha"
            echo "KERNEL_EFFECTIVE_SHA=$effective_sha"
          } >> "$GITHUB_ENV"

          echo "Kernel source ref: $KERNEL_REF"
          echo "Kernel source commit: $source_sha"
          echo "Kernel effective build commit: $effective_sha"
          echo "Kernel remote used: $kernel_remote"

          if [[ ! -f "$ACTIVE_BUILD_CONFIG" ]]; then
            echo "::error::BUILD_CONFIG does not exist: $ACTIVE_BUILD_CONFIG"
            exit 1
          fi

      - name: Configure ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: oneplus9pro-a17-bpf-${{ env.BUILD_PROFILE }}
          max-size: 2G

      - name: Build with Android kernel build framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          BUILD_CONFIG="$ACTIVE_BUILD_CONFIG" \
          VARIANT="$VARIANT" \
          LTO="$LTO" \
          BUILD_KERNEL="$BUILD_KERNEL" \
          build/build.sh 2>&1 | tee \
            "$GITHUB_WORKSPACE/kernel-build-${BUILD_PROFILE}.log"

      - name: Validate effective kernel configuration and BTF sections
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          config_path="$(find out -type f -path '*/kernel/msm-5.4/.config' \
            -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [[ -z "$config_path" || ! -f "$config_path" ]]; then
            echo "::error::Built kernel .config was not found"
            exit 1
          fi

          require_y() {
            local symbol="$1"
            grep -qx "${symbol}=y" "$config_path" || {
              echo "::error::$symbol is not enabled in $BUILD_PROFILE profile"
              exit 1
            }
          }

          require_disabled() {
            local symbol="$1"
            if grep -Eq "^${symbol}=(y|m)$" "$config_path"; then
              echo "::error::$symbol must be disabled in $BUILD_PROFILE profile"
              exit 1
            fi
          }

          for symbol in \
            CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_BPF_JIT_ALWAYS_ON \
            CONFIG_BPF_LSM CONFIG_DEBUG_INFO_BTF; do
            require_y "$symbol"
          done
          require_disabled CONFIG_FUNCTION_TRACER

          lsm_line="$(grep '^CONFIG_LSM=' "$config_path" || true)"
          if [[ "$lsm_line" != *bpf* ]]; then
            echo "::error::CONFIG_LSM does not contain bpf: $lsm_line"
            exit 1
          fi

          case "$BUILD_PROFILE" in
            plain)
              # Plain means the normal device build config. Do not assume that
              # device defaults such as PID_NS or KVM are disabled.
              ;;
            containers)
              for symbol in \
                CONFIG_IPC_NS CONFIG_PID_NS CONFIG_NET_NS CONFIG_SYSVIPC \
                CONFIG_POSIX_MQUEUE CONFIG_CGROUP_DEVICE CONFIG_CGROUP_PIDS \
                CONFIG_SECCOMP_FILTER CONFIG_FHANDLE CONFIG_OVERLAY_FS \
                CONFIG_BRIDGE_NETFILTER CONFIG_VETH CONFIG_KVM CONFIG_VHOST_NET; do
                require_y "$symbol"
              done
              require_disabled CONFIG_USER_NS
              require_disabled CONFIG_FAIR_GROUP_SCHED
              require_disabled CONFIG_RT_GROUP_SCHED
              ;;
          esac

          vmlinux_path="$(find out -type f -path '*/dist/vmlinux' \
            -print -quit 2>/dev/null || true)"
          if [[ -z "$vmlinux_path" ]]; then
            vmlinux_path="$(find out -type f -name vmlinux -size +1M \
              -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$vmlinux_path" || ! -f "$vmlinux_path" ]]; then
            echo "::error::Final vmlinux was not found"
            exit 1
          fi

          readelf -SW "$vmlinux_path" > \
            "$GITHUB_WORKSPACE/readelf-sections-${BUILD_PROFILE}.txt"
          python3 - "$vmlinux_path" <<'PY'
          import re
          import subprocess
          import sys

          path = sys.argv[1]
          output = subprocess.check_output(
              ["readelf", "-SW", path], text=True, errors="replace"
          )

          if not re.search(r"\]\s+\.BTF\s+", output):
              raise SystemExit("vmlinux does not contain a .BTF section")

          line = next(
              (line for line in output.splitlines()
               if re.search(r"\]\s+\.BTF_ids\s+", line)),
              None,
          )
          if line is None:
              raise SystemExit("vmlinux does not contain a .BTF_ids section")

          rest = line.split(".BTF_ids", 1)[1].split()
          if len(rest) < 3:
              raise SystemExit(f"could not parse .BTF_ids section: {line}")

          address = int(rest[1], 16)
          alignment = int(rest[-1], 0)
          if address % 4:
              raise SystemExit(
                  f".BTF_ids address 0x{address:x} is not 4-byte aligned"
              )
          if alignment < 4:
              raise SystemExit(
                  f".BTF_ids ELF alignment is {alignment}, expected at least 4"
              )

          print(
              f"Validated .BTF_ids: address=0x{address:x}, align={alignment}"
          )
          PY

          cp "$config_path" "$GITHUB_WORKSPACE/effective-${BUILD_PROFILE}.config"
          echo "Effective config: $config_path"
          echo "vmlinux: $vmlinux_path"

      - name: Collect kernel and AnyKernel3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p artifacts/dist

          image_path="$(find out -type f -path "*/dist/${KERNEL_IMAGE_NAME}" \
            -print -quit 2>/dev/null || true)"
          if [[ -z "$image_path" || ! -f "$image_path" ]]; then
            echo "::error::Built kernel image '$KERNEL_IMAGE_NAME' was not found in dist"
            exit 1
          fi
          dist_dir="$(dirname "$image_path")"

          cp -a "$dist_dir/." artifacts/dist/
          cp "$GITHUB_WORKSPACE/effective-${BUILD_PROFILE}.config" \
            artifacts/dist/effective.config
          cp "$GITHUB_WORKSPACE/readelf-sections-${BUILD_PROFILE}.txt" \
            artifacts/dist/readelf-sections.txt
          cp "$GITHUB_WORKSPACE/kernel-build-${BUILD_PROFILE}.log" \
            artifacts/dist/build.log
          {
            echo "kernel_ref=$KERNEL_REF"
            echo "source_sha=$KERNEL_SOURCE_SHA"
            echo "effective_sha=$KERNEL_EFFECTIVE_SHA"
            echo "build_profile=$BUILD_PROFILE"
            echo "build_config=$ACTIVE_BUILD_CONFIG"
          } > artifacts/dist/build-metadata.txt

          cp "$image_path" "ak3/$KERNEL_IMAGE_NAME"

          find_dist_file() {
            local candidate
            for candidate in "$@"; do
              if [[ -f "$dist_dir/$candidate" ]]; then
                printf '%s' "$dist_dir/$candidate"
                return 0
              fi
            done
            for candidate in "$@"; do
              local found
              found="$(find "$dist_dir" -maxdepth 2 -type f -name "$candidate" \
                -print -quit 2>/dev/null || true)"
              if [[ -n "$found" ]]; then
                printf '%s' "$found"
                return 0
              fi
            done
            return 1
          }

          dtb_lahaina="$(find_dist_file lahaina.dtb lahaina || true)"
          dtb_v2="$(find_dist_file lahaina-v2.dtb v2.dtb v2 || true)"
          dtb_v21="$(find_dist_file lahaina-v2.1.dtb v2.1.dtb v2.1 || true)"
          if [[ -z "$dtb_lahaina" || -z "$dtb_v2" || -z "$dtb_v21" ]]; then
            echo "::error::One or more required Lahaina DTBs were not found"
            find "$dist_dir" -maxdepth 2 -type f \
              \( -name '*.dtb' -o -name 'lahaina' -o -name 'v2' -o -name 'v2.1' \) \
              -printf '%P\n' | sort || true
            exit 1
          fi

          # Preserve the order used by the existing boot-tested package.
          cat "$dtb_lahaina" "$dtb_v21" "$dtb_v2" > ak3/dtb
          cp ak3/dtb artifacts/dist/dtb

          dtbo_path="$(find_dist_file dtbo.img || true)"
          if [[ -z "$dtbo_path" || ! -f "$dtbo_path" ]]; then
            echo "::error::Built dtbo.img was not found"
            exit 1
          fi
          cp "$dtbo_path" ak3/dtbo.img
          cp "$dtbo_path" artifacts/dist/dtbo.img

          package_name="AnyKernel3-OnePlus9Pro-A17-BPF-${BUILD_PROFILE}-${BUILD_TIME}.zip"
          (
            cd ak3
            zip -r9 "../artifacts/$package_name" . \
              -x '.git/*' '.github/*' 'README.md'
          )

          echo "PACKAGE_NAME=$package_name" >> "$GITHUB_ENV"
          sha256sum "$image_path" ak3/dtb ak3/dtbo.img \
            "artifacts/$package_name" | tee artifacts/SHA256SUMS
          cp artifacts/SHA256SUMS artifacts/dist/SHA256SUMS

      - name: Upload kernel dist
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ env.BUILD_PROFILE }}-dist-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/dist
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ env.BUILD_PROFILE }}-${{ env.BUILD_TIME }}
          path: |
            kernel_workspace/artifacts/${{ env.PACKAGE_NAME }}
            kernel_workspace/artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ env.BUILD_PROFILE }}-failure-${{ env.BUILD_TIME }}
          path: |
            kernel-build-${{ env.BUILD_PROFILE }}.log
            effective-${{ env.BUILD_PROFILE }}.config
            readelf-sections-${{ env.BUILD_PROFILE }}.txt
          if-no-files-found: ignore
