name: Reusable OnePlus 9 Pro Android 17 BPF build

on:
  workflow_call:
    inputs:
      profile:
        description: plain or containers
        required: false
        default: plain
        type: string
      kernel_ref:
        description: Kernel branch, tag, or commit
        required: false
        default: ''
        type: string
    secrets:
      PRIVATE_REPO_TOKEN:
        required: true

jobs:
  build:
    name: OnePlus 9 Pro / A17 BPF / ${{ inputs.profile }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      BUILD_PROFILE: ${{ inputs.profile }}
      REQUESTED_KERNEL_REF: ${{ inputs.kernel_ref }}

    steps:
      # maximize-build-space mounts a new filesystem over GITHUB_WORKSPACE.
      # It must run before checkout or the checked-out scripts disappear.
      - name: Free build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Load build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/config.env"
          test -f "$GITHUB_WORKSPACE/scripts/configure-build-profile.sh"
          test -f "$GITHUB_WORKSPACE/scripts/validate-kernel-config.sh"

          set -a
          source "$GITHUB_WORKSPACE/config.env"
          set +a

          for key in \
            MANIFEST_REPO MANIFEST_BRANCH DEFAULT_KERNEL_REF BUILD_CONFIG \
            VARIANT LTO BUILD_KERNEL KERNEL_IMAGE_NAME CONFIG_FRAGMENT \
            ENABLE_CCACHE; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::Missing $key in config.env"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done

          case "$BUILD_PROFILE" in
            plain|containers) ;;
            *)
              echo "::error::Unsupported profile: $BUILD_PROFILE"
              exit 1
              ;;
          esac

          kernel_ref="${REQUESTED_KERNEL_REF:-$DEFAULT_KERNEL_REF}"
          echo "KERNEL_REF=$kernel_ref" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(TZ=Asia/Tokyo date '+%Y%m%d-%H%M')" >> "$GITHUB_ENV"

          echo "Build profile: $BUILD_PROFILE"
          echo "Kernel ref: $kernel_ref"

      - name: Install build dependencies and repo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential ccache curl \
            device-tree-compiler dwarves flex git kmod libelf-dev liblz4-tool \
            libncurses-dev libssl-dev lz4 python3 rsync unzip zip zstd

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure private repository authentication
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::error::GH_PAT must read the private kernel and SukiSU repositories"
            exit 1
          fi

          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_REPO_TOKEN" \
            > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      - name: Initialize and sync kernel manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH"
          repo sync --force-sync --no-clone-bundle --current-branch --no-tags \
            -j"$(nproc --all)"

          test -d kernel/msm-5.4
          test -d modules_devicetree
          test -d ak3

          echo "Manifest revision: $(git -C .repo/manifests rev-parse HEAD)"
          echo "Manifest kernel revision: $(git -C kernel/msm-5.4 rev-parse HEAD)"

      - name: Select requested Android 17 BPF kernel ref
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel/msm-5.4"

          if git remote | grep -qx tqmane; then
            kernel_remote=tqmane
          elif git remote | grep -qx origin; then
            kernel_remote=origin
          else
            kernel_remote="$(git remote | head -n1)"
          fi
          if [[ -z "$kernel_remote" ]]; then
            echo "::error::Kernel checkout has no git remote"
            exit 1
          fi

          echo "Fetching $KERNEL_REF from remote $kernel_remote"
          git fetch --no-tags --depth=1 "$kernel_remote" "$KERNEL_REF"
          git checkout --detach FETCH_HEAD
          git submodule sync --recursive
          git submodule update --init --recursive

          kernel_sha="$(git rev-parse HEAD)"
          echo "KERNEL_SHA=$kernel_sha" >> "$GITHUB_ENV"
          echo "Selected kernel: $kernel_sha"
          git status --short

      - name: Apply selected feature profile
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          bash "$GITHUB_WORKSPACE/scripts/configure-build-profile.sh" \
            "$CONFIG_FRAGMENT" "$BUILD_PROFILE"

      - name: Apply local LXC cgroup compatibility patch
        if: env.BUILD_PROFILE == 'containers'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          patch_file="$GITHUB_WORKSPACE/patch/cgroup.patch"

          if git -C kernel/msm-5.4 apply --check "$patch_file"; then
            git -C kernel/msm-5.4 apply "$patch_file"
            echo "Applied cgroup v1 compatibility aliases"
          elif git -C kernel/msm-5.4 apply --reverse --check "$patch_file"; then
            echo "cgroup v1 compatibility patch is already present"
          else
            echo "::error::The vendored cgroup compatibility patch no longer applies"
            exit 1
          fi

          # xt_qtaguid is intentionally not patched. Replacing live interface
          # statistics with zeroes is unrelated to LXC/Docker and breaks Android
          # traffic accounting.

      - name: Configure ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: oneplus9pro-a17-bpf-${{ inputs.profile }}
          max-size: 2G

      - name: Build with Android kernel build framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [[ ! -f "$BUILD_CONFIG" ]]; then
            echo "::error::BUILD_CONFIG does not exist: $BUILD_CONFIG"
            exit 1
          fi

          BUILD_CONFIG="$BUILD_CONFIG" \
          VARIANT="$VARIANT" \
          LTO="$LTO" \
          BUILD_KERNEL="$BUILD_KERNEL" \
          build/build.sh

      - name: Validate final kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          final_config="$(find out -type f -name .config \
            -path '*/kernel/msm-5.4/.config' -print -quit 2>/dev/null || true)"
          if [[ -z "$final_config" ]]; then
            final_config="$(find out -type f -name .config -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$final_config" || ! -f "$final_config" ]]; then
            echo "::error::Unable to find the generated kernel .config"
            exit 1
          fi

          bash "$GITHUB_WORKSPACE/scripts/validate-kernel-config.sh" \
            "$final_config" "$BUILD_PROFILE"
          echo "FINAL_CONFIG=$final_config" >> "$GITHUB_ENV"

      - name: Collect kernel and AnyKernel3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p artifacts

          dist_dir="$(find out -type d -name dist -print -quit 2>/dev/null || true)"
          if [[ -z "$dist_dir" || ! -d "$dist_dir" ]]; then
            echo "::error::Kernel build completed without a dist directory"
            exit 1
          fi

          find_output() {
            local name="$1"
            local found
            found="$(find "$dist_dir" -maxdepth 1 -type f -name "$name" \
              -print -quit 2>/dev/null || true)"
            if [[ -z "$found" ]]; then
              found="$(find out -type f -name "$name" -print -quit \
                2>/dev/null || true)"
            fi
            printf '%s' "$found"
          }

          image_path="$(find_output "$KERNEL_IMAGE_NAME")"
          if [[ -z "$image_path" || ! -f "$image_path" ]]; then
            echo "::error::Built kernel image '$KERNEL_IMAGE_NAME' was not found"
            exit 1
          fi

          cp -a "$dist_dir" artifacts/dist
          cp "$FINAL_CONFIG" artifacts/dist/kernel.config
          cp "$image_path" "ak3/$KERNEL_IMAGE_NAME"

          dtb_lahaina="$(find_output lahaina.dtb)"
          dtb_v2="$(find_output lahaina-v2.dtb)"
          dtb_v21="$(find_output lahaina-v2.1.dtb)"
          if [[ -z "$dtb_lahaina" || -z "$dtb_v2" || -z "$dtb_v21" ]]; then
            echo "::error::One or more required DTBs were not found"
            find "$dist_dir" -maxdepth 1 -type f -name '*.dtb' -printf '%f\n' \
              | sort || true
            exit 1
          fi
          cat "$dtb_lahaina" "$dtb_v2" "$dtb_v21" > ak3/dtb
          cp ak3/dtb artifacts/dist/dtb

          dtbo_path="$(find_output dtbo.img)"
          if [[ -z "$dtbo_path" || ! -f "$dtbo_path" ]]; then
            echo "::error::Built dtbo.img was not found"
            exit 1
          fi
          cp "$dtbo_path" ak3/dtbo.img
          cp "$dtbo_path" artifacts/dist/dtbo.img

          manifest_sha="$(git -C .repo/manifests rev-parse HEAD)"
          modules_sha="$(git -C modules_devicetree rev-parse HEAD)"
          config_sha="$(sha256sum "$FINAL_CONFIG" | awk '{print $1}')"
          cat > artifacts/dist/build-info.txt <<EOF
          profile=$BUILD_PROFILE
          kernel_ref=$KERNEL_REF
          kernel_sha=$KERNEL_SHA
          manifest_repo=$MANIFEST_REPO
          manifest_branch=$MANIFEST_BRANCH
          manifest_sha=$manifest_sha
          modules_sha=$modules_sha
          build_config=$BUILD_CONFIG
          variant=$VARIANT
          lto=$LTO
          config_sha256=$config_sha
          EOF

          zip_name="AnyKernel3-OnePlus9Pro-A17-BPF-${BUILD_PROFILE}-${BUILD_TIME}.zip"
          (
            cd ak3
            zip -r9 "../artifacts/$zip_name" . \
              -x '.git/*' '.github/*' 'README.md'
          )

          echo "Kernel image: $image_path"
          echo "Combined DTB size: $(stat -c '%s' ak3/dtb) bytes"
          echo "DTBO image: $dtbo_path ($(stat -c '%s' ak3/dtbo.img) bytes)"
          ls -lh "artifacts/$zip_name"

      - name: Upload kernel dist
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-A17-BPF-${{ inputs.profile }}-dist-run-${{ github.run_number }}
          path: kernel_workspace/artifacts/dist
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-OnePlus9Pro-A17-BPF-${{ inputs.profile }}-run-${{ github.run_number }}
          path: kernel_workspace/artifacts/AnyKernel3-OnePlus9Pro-A17-BPF-${{ inputs.profile }}-*.zip
          if-no-files-found: error
