name: Build OnePlus 9 Pro LXC/Docker kernel

on:
  watch:
    types: [started]
  workflow_call:
    secrets:
      PRIVATE_REPO_TOKEN:
        required: false

jobs:
  build:
    name: OnePlus 9 Pro / manifest / LXC + Docker
    runs-on: ubuntu-latest
    if: github.event_name != 'watch' || github.event.repository.owner.id == github.event.sender.id

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout action repository
        uses: actions/checkout@v4

      - name: Load build configuration
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "$GITHUB_WORKSPACE/config.env"
          set +a

          for key in \
            MANIFEST_REPO MANIFEST_BRANCH BUILD_CONFIG VARIANT LTO BUILD_KERNEL \
            KERNEL_IMAGE_NAME CONFIG_FRAGMENT LXC_DOCKER LXC_PATCH \
            ANDROID_PARANOID_NETWORK_OFF ENABLE_KVM ENABLE_CCACHE; do
            value="${!key:-}"
            if [[ -z "$value" ]]; then
              echo "::error::Missing $key in config.env"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done

          echo "BUILD_TIME=$(TZ=Asia/Tokyo date '+%Y%m%d-%H%M')" >> "$GITHUB_ENV"

      - name: Free build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies and repo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential ccache curl \
            device-tree-compiler flex git libelf-dev liblz4-tool libncurses-dev \
            libssl-dev lz4 python3 rsync unzip zip zstd

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure private repository authentication
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_REPO_TOKEN:-}" ]]; then
            echo "::error::PRIVATE_REPO_TOKEN is required. The manifest references private repositories, including tqmane/android_kernel_oppo_sm8350-private and its private KernelSU/SukiSU submodule. Add a fine-grained PAT with read access to every private repository referenced by the manifest."
            exit 1
          fi

          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$PRIVATE_REPO_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"

      - name: Initialize and sync kernel manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH"
          repo sync --force-sync --no-clone-bundle --current-branch --no-tags -j"$(nproc --all)"

          test -d kernel/msm-5.4
          test -d modules_devicetree
          test -d ak3

          echo "Kernel source: $(git -C kernel/msm-5.4 rev-parse HEAD)"
          if [[ -e kernel/msm-5.4/KernelSU ]]; then
            echo "KernelSU/SukiSU source is present because it is part of the supplied manifest/kernel repository. This Action does not install or modify it."
          fi

      - name: Enable LXC and Docker kernel configuration
        if: env.LXC_DOCKER == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [[ ! -f "$CONFIG_FRAGMENT" ]]; then
            echo "::error::Config fragment not found: $CONFIG_FRAGMENT"
            exit 1
          fi

          curl -fsSL \
            https://raw.githubusercontent.com/wu17481748/android-lxc-docker/main/LXC-DOCKER-OPEN-CONFIG.sh \
            -o /tmp/LXC-DOCKER-OPEN-CONFIG.sh
          chmod +x /tmp/LXC-DOCKER-OPEN-CONFIG.sh
          /tmp/LXC-DOCKER-OPEN-CONFIG.sh "$CONFIG_FRAGMENT" -w

          # The generic helper also enables optional Docker storage drivers.
          # This OnePlus 5.4 tree has a Btrfs/ZSTD API mismatch and does not
          # need Btrfs or AUFS for LXC/Docker. Keep OverlayFS as the storage
          # driver and explicitly disable the incompatible optional drivers.
          sed -i \
            -e '/^CONFIG_BTRFS_FS=/d' \
            -e '/^# CONFIG_BTRFS_FS is not set$/d' \
            -e '/^CONFIG_BTRFS_FS_POSIX_ACL=/d' \
            -e '/^# CONFIG_BTRFS_FS_POSIX_ACL is not set$/d' \
            -e '/^CONFIG_AUFS_FS=/d' \
            -e '/^# CONFIG_AUFS_FS is not set$/d' \
            -e '/^CONFIG_OVERLAY_FS=/d' \
            -e '/^# CONFIG_OVERLAY_FS is not set$/d' \
            -e '/^CONFIG_!SCHED_WALT/d' \
            "$CONFIG_FRAGMENT"
          cat >> "$CONFIG_FRAGMENT" <<'EOF'
          # CONFIG_BTRFS_FS is not set
          # CONFIG_AUFS_FS is not set
          CONFIG_OVERLAY_FS=y
          EOF

          echo "Storage-driver config after LXC/Docker sanitization:"
          grep -E '^(CONFIG_(BTRFS_FS|AUFS_FS|OVERLAY_FS)=|# CONFIG_(BTRFS_FS|AUFS_FS|OVERLAY_FS) is not set)' "$CONFIG_FRAGMENT" || true

      - name: Apply LXC runtime patches
        if: env.LXC_PATCH == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          curl -fsSL \
            https://raw.githubusercontent.com/wu17481748/android-lxc-docker/main/cgroup.patch \
            -o /tmp/cgroup.patch
          curl -fsSL \
            https://raw.githubusercontent.com/wu17481748/android-lxc-docker/main/xt_qtaguid.patch \
            -o /tmp/xt_qtaguid.patch

          apply_patch() {
            local patch_file="$1"
            local label="$2"

            if patch --dry-run -d kernel/msm-5.4 -p1 < "$patch_file" >/dev/null 2>&1; then
              patch -d kernel/msm-5.4 -p1 < "$patch_file"
              echo "$label applied"
            elif patch -R --dry-run -d kernel/msm-5.4 -p1 < "$patch_file" >/dev/null 2>&1; then
              echo "$label is already applied"
            else
              echo "::error::$label does not apply cleanly to this kernel branch"
              exit 1
            fi
          }

          if [[ -f kernel/msm-5.4/kernel/cgroup/cgroup.c ]]; then
            apply_patch /tmp/cgroup.patch "cgroup LXC patch"
          elif [[ -f kernel/msm-5.4/kernel/cgroup.c ]]; then
            echo "::warning::Legacy kernel/cgroup.c layout detected; upstream cgroup patch targets kernel/cgroup/cgroup.c, skipping it"
          else
            echo "::warning::No cgroup.c found; skipping cgroup LXC patch"
          fi

          if [[ -f kernel/msm-5.4/net/netfilter/xt_qtaguid.c ]]; then
            apply_patch /tmp/xt_qtaguid.patch "xt_qtaguid LXC patch"
          else
            echo "xt_qtaguid.c not present; patch not required"
          fi

      - name: Disable Android paranoid network
        if: env.ANDROID_PARANOID_NETWORK_OFF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          sed -i '/CONFIG_ANDROID_PARANOID_NETWORK/d' "$CONFIG_FRAGMENT"
          echo '# CONFIG_ANDROID_PARANOID_NETWORK is not set' >> "$CONFIG_FRAGMENT"

      - name: Enable KVM configuration
        if: env.ENABLE_KVM == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          cat >> "$CONFIG_FRAGMENT" <<'EOF'
          CONFIG_VIRTUALIZATION=y
          CONFIG_KVM=y
          CONFIG_VHOST_NET=y
          CONFIG_VHOST_CROSS_ENDIAN_LEGACY=y
          EOF

      - name: Configure ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: oneplus9pro-lxc-docker-manifest
          max-size: 2G

      - name: Build with Android kernel build framework
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          if [[ ! -f "$BUILD_CONFIG" ]]; then
            echo "::error::BUILD_CONFIG does not exist: $BUILD_CONFIG"
            exit 1
          fi

          BUILD_CONFIG="$BUILD_CONFIG" \
          VARIANT="$VARIANT" \
          LTO="$LTO" \
          BUILD_KERNEL="$BUILD_KERNEL" \
          build/build.sh

      - name: Collect kernel and AnyKernel3 artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          mkdir -p artifacts

          DIST_DIR="$(find out -type d -name dist -print -quit 2>/dev/null || true)"
          if [[ -z "$DIST_DIR" || ! -d "$DIST_DIR" ]]; then
            echo "::error::Kernel build completed without a dist directory"
            find out -maxdepth 4 -type f 2>/dev/null | head -200 || true
            exit 1
          fi

          find_output() {
            local name="$1"
            local found
            found="$(find "$DIST_DIR" -maxdepth 1 -type f -name "$name" -print -quit 2>/dev/null || true)"
            if [[ -z "$found" ]]; then
              found="$(find out -type f -name "$name" -print -quit 2>/dev/null || true)"
            fi
            printf '%s' "$found"
          }

          IMAGE_PATH="$(find_output "$KERNEL_IMAGE_NAME")"
          if [[ -z "$IMAGE_PATH" || ! -f "$IMAGE_PATH" ]]; then
            echo "::error::Built kernel image '$KERNEL_IMAGE_NAME' was not found"
            find "$DIST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          cp -a "$DIST_DIR" artifacts/dist
          cp "$IMAGE_PATH" "ak3/$KERNEL_IMAGE_NAME"

          # The manifest-provided AnyKernel3 explicitly replaces the boot DTB,
          # so build the same 3-DTB concatenation used by the known-good package.
          DTB_LAHAINA="$(find_output lahaina.dtb)"
          DTB_V2="$(find_output lahaina-v2.dtb)"
          DTB_V21="$(find_output lahaina-v2.1.dtb)"

          if [[ -z "$DTB_LAHAINA" || -z "$DTB_V2" || -z "$DTB_V21" ]]; then
            echo "::error::One or more required DTBs were not found: lahaina.dtb, lahaina-v2.dtb, lahaina-v2.1.dtb"
            echo "Dist DTB files:"
            find "$DIST_DIR" -maxdepth 1 -type f -name '*.dtb' -printf '%f\n' | sort || true
            exit 1
          fi

          cat "$DTB_LAHAINA" "$DTB_V2" "$DTB_V21" > ak3/dtb
          cp ak3/dtb artifacts/dist/dtb

          # ak3-core.sh accepts either dtbo or dtbo.img and write_boot flashes
          # it to the dtbo partition, so include the freshly built dtbo.img.
          DTBO_PATH="$(find_output dtbo.img)"
          if [[ -z "$DTBO_PATH" || ! -f "$DTBO_PATH" ]]; then
            echo "::error::Built dtbo.img was not found"
            find "$DIST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi
          cp "$DTBO_PATH" ak3/dtbo.img
          cp "$DTBO_PATH" artifacts/dist/dtbo.img

          echo "Kernel image: $IMAGE_PATH"
          echo "Combined DTB sources:"
          printf '  %s\n  %s\n  %s\n' "$DTB_LAHAINA" "$DTB_V2" "$DTB_V21"
          echo "Combined DTB size: $(stat -c '%s' ak3/dtb) bytes"
          echo "DTBO image: $DTBO_PATH ($(stat -c '%s' ak3/dtbo.img) bytes)"

          (
            cd ak3
            zip -r9 "../artifacts/AnyKernel3-OnePlus9Pro-LXC-Docker-${BUILD_TIME}.zip" . \
              -x '.git/*' '.github/*' 'README.md'
          )

          unzip -l "artifacts/AnyKernel3-OnePlus9Pro-LXC-Docker-${BUILD_TIME}.zip" | \
            grep -E '(^|[[:space:]])(Image|dtb|dtbo\.img)$' || true
          ls -lh artifacts/*.zip

      - name: Upload kernel dist
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus9Pro-LXC-Docker-dist-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/dist
          if-no-files-found: error

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-OnePlus9Pro-LXC-Docker-${{ env.BUILD_TIME }}
          path: kernel_workspace/artifacts/AnyKernel3-OnePlus9Pro-LXC-Docker-${{ env.BUILD_TIME }}.zip
          if-no-files-found: error
